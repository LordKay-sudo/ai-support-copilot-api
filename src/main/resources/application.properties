spring.application.name=ai-support-copilot-api

# HS256 symmetric key (32+ bytes). Override in production via COPILOT_JWT_SECRET.
spring.security.oauth2.resourceserver.jwt.secret-key=${COPILOT_JWT_SECRET:12345678901234567890123456789012}

management.endpoints.web.exposure.include=health,info,metrics,prometheus

server.port=8080

copilot.retrieval.top-k=3
copilot.retrieval.min-score=0.5
copilot.retrieval.embedding-dimensions=1536
copilot.retrieval.debug-search-enabled=true
copilot.retrieval.store-type=in-memory

# Enable when using copilot.retrieval.store-type=pgvector
spring.datasource.url=${COPILOT_DB_URL:}
spring.datasource.username=${COPILOT_DB_USERNAME:}
spring.datasource.password=${COPILOT_DB_PASSWORD:}

# Set OPENAI_API_KEY in your environment before running with model-backed answers.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.pattern.level=%5p [req:%X{requestId}]

# OpenTelemetry OTLP export is opt-in via the `otel` profile (see application-otel.properties).
management.tracing.enabled=false
management.otlp.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
