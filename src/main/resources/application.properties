spring.application.name=ai-support-copilot-api

management.endpoints.web.exposure.include=health,info,metrics,prometheus

server.port=8080

copilot.retrieval.top-k=3
copilot.retrieval.min-score=0.5
copilot.retrieval.store-type=in-memory

# Enable when using copilot.retrieval.store-type=pgvector
spring.datasource.url=${COPILOT_DB_URL:}
spring.datasource.username=${COPILOT_DB_USERNAME:}
spring.datasource.password=${COPILOT_DB_PASSWORD:}

# Set OPENAI_API_KEY in your environment before running with model-backed answers.
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
