# CI-friendly defaults: Spring AI requires a non-empty API key for auto-configuration.
# Tests do not call the remote model because CopilotService only builds ChatClient lazily.
spring.ai.openai.api-key=test-ci-key

# Must match com.lordkaysudo.aisupportcopilotapi.support.TestJwtTokens.SECRET
spring.security.oauth2.resourceserver.jwt.secret-key=12345678901234567890123456789012

# JDBC auto-configuration is only needed for pgvector mode; exclude it for unit/integration tests.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
