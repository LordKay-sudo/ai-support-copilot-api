services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: copilot-pgvector
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
