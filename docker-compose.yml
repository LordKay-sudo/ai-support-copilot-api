services:
  api:
    build: .
    container_name: copilot-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: pgvector
      COPILOT_DB_URL: jdbc:postgresql://pgvector:5432/copilot
      COPILOT_DB_USERNAME: postgres
      COPILOT_DB_PASSWORD: postgres
      COPILOT_JWT_SECRET: ${COPILOT_JWT_SECRET:-12345678901234567890123456789012}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      pgvector:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.107.0
    container_name: copilot-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: copilot-pgvector
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d copilot"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data:
